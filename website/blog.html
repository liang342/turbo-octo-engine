<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>昆虫社 | 个人 Blog</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/refresh.css" />
  </head>
  <body class="is-preload">
    <div id="page-wrapper" class="refresh-page">
      <header class="topbar">
        <a class="brand" href="index.html">🐞 昆虫社</a>
        <nav class="menu">
          <a href="index.html">首页</a>
          <a href="blog.html" class="active">个人 Blog</a>
          <a href="twocolumn1.html">新手指南</a>
        </nav>
      </header>

      <main class="blog-layout">
        <section class="panel">
          <h1 id="formTitle">发布新文章</h1>
          <p>支持草稿自动保存、文章编辑、标签过滤和 JSON 导出。</p>
          <form id="blogForm" class="blog-form">
            <input id="editingId" type="hidden" />
            <label>
              标题
              <input id="title" type="text" maxlength="80" required placeholder="例如：第一次拍到竹节虫" />
            </label>
            <label>
              标签（逗号分隔）
              <input id="tags" type="text" maxlength="60" placeholder="例如：观察, 饲养, 摄影" />
            </label>
            <label>
              正文
              <textarea id="content" rows="8" required placeholder="写下今天的观察细节..."></textarea>
              <small id="wordCount" class="muted">0 字</small>
            </label>
            <div class="form-actions">
              <button id="submitBtn" type="submit" class="btn btn-primary">发布文章</button>
              <button id="cancelEditBtn" type="button" class="btn btn-ghost hidden">取消编辑</button>
            </div>
          </form>
        </section>

        <section class="panel">
          <div class="blog-list-header">
            <h2>我的文章</h2>
            <div class="list-actions">
              <button id="exportBtn" class="btn btn-ghost" type="button">导出 JSON</button>
              <button id="clearBtn" class="btn btn-ghost" type="button">清空全部</button>
            </div>
          </div>
          <label class="search-wrap">
            搜索
            <input id="searchInput" type="text" placeholder="按标题、标签或正文搜索" />
          </label>
          <div id="postList" class="post-list"></div>
        </section>
      </main>
    </div>

    <script src="js/blog.js"></script>
  </body>
</html>

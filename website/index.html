<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>昆虫社 | 焕新主页</title>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/refresh.css" />
  </head>
  <body class="is-preload">
    <div id="page-wrapper" class="refresh-page">
      <header class="topbar">
        <a class="brand" href="index.html">昆虫社</a>
        <nav class="menu">
          <a href="index.html" class="active">首页</a>
          <a href="blog.html">个人 Blog</a>
          <a href="twocolumn1.html">新手指南</a>
          <a href="onecolumn.html">资源</a>
          <a href="threecolumn.html">网站推荐</a>
        </nav>
      </header>

      <main>
        <section class="hero">
          <div>
            <p class="tag">INSECT EXPLORER</p>
            <h1>让热爱发声，记录每一次观察</h1>
            <p class="intro">
              欢迎来到焕新后的昆虫社。这里是你的昆虫观察笔记、饲养心得和摄影作品展厅，
              现在还新增了个人 Blog 功能，轻松发布每一篇成长记录。
            </p>
            <div class="hero-actions">
              <a class="btn btn-primary" href="blog.html">立即写 Blog</a>
              <a class="btn btn-ghost" href="https://www.inaturalist.org/observations?taxon_id=47335">查看观察数据库</a>
            </div>
          </div>
          <figure>
            <img src="images/sousuo.jpeg" alt="昆虫观察" />
          </figure>
        </section>

        <section class="panel-grid">
          <article class="panel">
            <h2>今日时钟</h2>
            <p id="clock" class="clock">00:00:00</p>
            <small>保持节奏，持续记录。</small>
          </article>
          <article class="panel">
            <h2>快捷入口</h2>
            <div class="quick-links">
              <a href="poki.html">小游戏 1</a>
              <a href="index (4).html">小游戏 2</a>
              <a href="upload.asp">实验上传页</a>
            </div>
          </article>
          <article class="panel">
            <h2>本周目标</h2>
            <ul>
              <li>完成 3 篇昆虫观察记录</li>
              <li>整理 1 次拍摄器材清单</li>
              <li>分享 1 篇养护经验 Blog</li>
            </ul>
          </article>
        </section>
      </main>
    </div>

    <script>
      function formatTime(unit) {
        return unit < 10 ? "0" + unit : unit;
      }

      function updateClock() {
        const now = new Date();
        const hours = formatTime(now.getHours());
        const minutes = formatTime(now.getMinutes());
        const seconds = formatTime(now.getSeconds());
        document.getElementById("clock").innerText = `${hours}:${minutes}:${seconds}`;
      }

      setInterval(updateClock, 1000);
      updateClock();
    </script>
  </body>
